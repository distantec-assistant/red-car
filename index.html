function occupancy(s){let grid=new Int8Array(36).fill(-1);cars.forEach((c,i)=>{for(let k=0;k<c[2];k++){let x=c[0]==='h'?s[i]+k:c[1],y=c[0]==='v'?s[i]+k:c[1];grid[y*6+x]=i}});return grid}
function bounds(i,s=state,grid=occupancy(s)){let c=cars[i],lo=s[i],hi=lo;const free=p=>grid[(c[0]==='h'?c[1]:p)*6+(c[0]==='h'?p:c[1])]<0;while(lo>0&&free(lo-1))lo--;while(hi+c[2]<6&&free(hi+c[2]))hi++;return [lo,hi]}
function canExit(s=state,grid=occupancy(s)){for(let x=s[0]+2;x<6;x++)if(grid[12+x]>=0)return false;return true}
function update(){state.forEach((p,i)=>position(i,p));$('undo').disabled=!history.length||busy;$('exit').disabled=busy||!canExit();$('hint').disabled=busy||hintLeft()>0;hintClock()}
function clearHint(){hintToken++;board.querySelectorAll('.hint').forEach(e=>e.classList.remove('hint'));board.querySelectorAll('.hint-arrow').forEach(e=>e.remove())}
function down(e){if(busy||drag||e.button>0)return;e.preventDefault();unlockAudio();clearHint();let i=+e.currentTarget.dataset.index,[lo,hi]=bounds(i);drag={i,id:e.pointerId,start:cars[i][0]==='h'?e.clientX:e.clientY,origin:state[i],lo,hi,p:state[i],el:e.currentTarget,exit: i===0&&canExit()};drag.el.setPointerCapture(e.pointerId)}
board.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;e.preventDefault();let d=drag,coord=cars[d.i][0]==='h'?e.clientX:e.clientY;d.p=Math.max(d.lo,Math.min(d.exit?5.5:d.hi,d.origin+(coord-d.start)/(board.clientWidth/6)));position(d.i,d.p)});
function end(e,cancel=false){if(!drag||e.pointerId!==drag.id)return;let d=drag;drag=null;if(cancel){update();return}if(d.exit&&d.p>=4.35){history.push([...state]);win();return}let p=Math.max(d.lo,Math.min(d.hi,Math.round(d.p)));if(p!==state[d.i]){history.push([...state]);state[d.i]=p;beep(370,.035,.035)}update()}
board.addEventListener('pointerup',e=>end(e));board.addEventListener('pointercancel',e=>end(e,true));board.addEventListener('lostpointercapture',e=>{if(drag&&e.pointerId===drag.id)end(e,true)});
function keyMove(e,i){if(busy||drag)return;let dir=({'ArrowLeft':-1,'ArrowRight':1,'ArrowUp':-1,'ArrowDown':1})[e.key];if(!dir)return;if(cars[i][0]==='h'&&!['ArrowLeft','ArrowRight'].includes(e.key)||cars[i][0]==='v'&&!['ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();unlockAudio();clearHint();if(i===0&&dir===1&&canExit()&&state[0]===4){history.push([...state]);win();return}let [lo,hi]=bounds(i),p=state[i]+dir;if(p>=lo&&p<=hi){history.push([...state]);state[i]=p;update()}}
function unlockAudio(){if(!saved.sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume().catch(()=>{})}catch(e){}}
function beep(freq,dur=.12,volume=.09,delay=0){if(!saved.sound||!audio)return;try{let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+delay;o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(volume,t+.012);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}}
function soundUI(){$('sound').textContent=saved.sound?'♪':'♫̸';$('sound').setAttribute('aria-label',saved.sound?'Выключить звук':'Включить звук')}
$('sound').onclick=()=>{saved.sound=!saved.sound;save();soundUI();unlockAudio();beep(660)};
function win(){if(busy)return;cancelCatalogHold();busy=true;clearHint();update();let el=board.querySelector('[data-index="0"]');el.classList.add('exiting');requestAnimationFrame(()=>position(0,7.1));if(!saved.completed.includes(level))saved.completed.push(level);let mv=history.length,mn=LEVELS[level].minMoves,st=starsFor(mv,mn,hintUsed);saved.stars=saved.stars||{};if(st>(saved.stars[level]||0))saved.stars[level]=st;save();$('winStars').innerHTML='<span class=on>★</span>'.repeat(st)+'<span class=off>★</span>'.repeat(3-st);$('winInfo').textContent=hintUsed?`Ходов: ${mv}. С подсказкой — одна звезда`:(st===3?`Ходов: ${mv}. Отлично!`:`Ходов: ${mv}. Можно за ${mn}`);$('progress').textContent=starText(bestStars(level)).trim();$('status').textContent='Ура! Машинка выехала!';[523,659,784,1047].forEach((f,i)=>beep(f,.25,.1,i*.13));winTimer=setTimeout(()=>{$('winModal').classList.add('open');$('next').focus();confetti()},800)}
$('exit').onclick=()=>{if(!busy&&!drag&&canExit()){unlockAudio();history.push([...state]);win()}};
$('undo').onclick=()=>{if(busy||drag||!history.length)return;clearHint();state=history.pop();update()};$('restart').onclick=()=>load(level);
$('next').onclick=()=>{if(level+1<LEVELS.length)startRide(level+1);else{load(0);openPicker()}};
function openPicker(){cancelCatalogHold();if(drag)return;$('winModal').classList.remove('open');const picker=$('picker');picker.innerHTML='';for(let start=0;start<LEVELS.length;start+=10){let end=Math.min(start+10,LEVELS.length),label=document.createElement('div');label.className='group-label';label.innerHTML=`${start+1}–${end} <span>${LEVELS[start].minMoves}–${LEVELS[end-1].minMoves} ↔</span>`;picker.appendChild(label);let grid=document.createElement('div');grid.className='picker';picker.appendChild(grid);for(let i=start;i<end;i++){let b=document.createElement('button');b.className='level'+(saved.completed.includes(i)?' done':'')+(i===level?' current':'');b.dataset.band=Math.max(0,Math.min(4,Math.floor((LEVELS[i].minMoves-5)/8)));let bs=bestStars(i);b.innerHTML=`${i+1}${bs?`<small class=st>${'★'.repeat(bs)}</small>`:''}`;b.setAttribute('aria-label',`Уровень ${i+1}, ${LEVELS[i].minMoves} ходов${LEVELS[i].sourceCard?`, карточка оригинала ${LEVELS[i].sourceCard}`:''}${saved.completed.includes(i)?`, пройден, звёзд: ${bestStars(i)}`:''}`);b.onclick=()=>load(i);grid.appendChild(b)}}$('levelsModal').classList.add('open');$('closePicker').focus();requestAnimationFrame(()=>{let active=picker.querySelector('.current');if(active)picker.scrollTop=active.offsetTop-picker.offsetTop-picker.clientHeight/2+active.clientHeight/2})}
$('pickerBtn').onclick=openPicker;$('winPicker').onclick=openPicker;$('closePicker').onclick=()=>{$('levelsModal').classList.remove('open');$('pickerBtn').focus()};$('levelsModal').onclick=e=>{if(e.target===$('levelsModal'))$('closePicker').click()};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('closePicker').click()});
function stateKey(s){let key=0,mul=1;for(let i=0;i<s.length;i++){key+=s[i]*mul;mul*=8}return key}
function cacheSolution(start,path){let s=start.slice();for(let move of path){solutionCache.set(stateKey(s),move);if(!move.exit)s[move.i]=move.p}}
// An independent exact breadth-first search. Packed numeric state keys avoid string/array allocation.
// The initial shortest route is precomputed; off-route searches yield regularly and can be cancelled.
async function solvePath(start,token){let initial=stateKey(start),queue=[initial],seen=new Map([[initial,0]]),parents=[-1],moves=[null],head=0,started=performance.now();
for(;head<queue.length;head++){if(token!==hintToken)return null;let key=queue[head],s=new Array(cars.length),value=key;for(let i=0;i<s.length;i++){s[i]=value%8;value=Math.floor(value/8)}let grid=occupancy(s);
if(canExit(s,grid)){let route=[{i:0,dir:1,exit:true}];for(let node=head;parents[node]>=0;node=parents[node])route.push(moves[node]);route.reverse();return route}
let mul=1;for(let i=0;i<cars.length;i++){let [lo,hi]=bounds(i,s,grid);for(let p=lo;p<=hi;p++){if(p===s[i])continue;let next=key+(p-s[i])*mul;if(seen.has(next))continue;seen.set(next,queue.length);queue.push(next);parents.push(head);moves.push({i,dir:Math.sign(p-s[i]),p})}mul*=8}
if(head%1500===1499)await new Promise(r=>setTimeout(r,0));
// All level components were verified below 160,000 states; this protects against corrupted data.
if(queue.length>200000||performance.now()-started>12000)return null;
}return null}
async function solve(start,token){const cached=solutionCache.get(stateKey(start));if(cached)return cached;let route=await solvePath(start,token);if(route&&token===hintToken){cacheSolution(start,route);return route[0]}return null}
$('hint').onclick=async()=>{if(busy||drag||hintLeft()>0)return;clearHint();let token=hintToken;$('hint').disabled=true;let hint=await solve(state,token);if(token!==hintToken)return;$('hint').disabled=busy;if(!hint)return;let el=board.querySelector(`[data-index="${hint.i}"]`);hintUsed=true;el.classList.add('hint');let arrow=document.createElement('span');arrow.className='hint-arrow';arrow.textContent=cars[hint.i][0]==='h'?(hint.dir>0?'➜':'⬅'):(hint.dir>0?'⬇':'⬆');el.appendChild(arrow)};
function confetti(){const canvas=$('confetti'),ctx=canvas.getContext('2d'),dpr=Math.min(window.devicePixelRatio||1,2),w=innerWidth,h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.scale(dpr,dpr);let pieces=Array.from({length:90},()=>({x:w/2,y:h*.4,vx:(Math.random()-.5)*12,vy:-Math.random()*13-2,r:Math.random()*5+4,color:colors[Math.floor(Math.random()*colors.length)],angle:Math.random()*6})),start=performance.now();function frame(now){ctx.clearRect(0,0,w,h);let age=now-start;for(let p of pieces){p.x+=p.vx;p.y+=p.vy;p.vy+=.14;p.angle+=.07;ctx.save();ctx.globalAlpha=Math.min(1,(3000-age)/600);ctx.translate(p.x,p.y);ctx.rotate(p.angle);ctx.fillStyle=p.color;ctx.beginPath();for(let k=0;k<10;k++){let a=k*Math.PI/5,r=k%2?p.r*.45:p.r;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.restore()}if(age<3000)requestAnimationFrame(frame);else ctx.clearRect(0,0,w,h)}requestAnimationFrame(frame)}
const RIDE_MS=3000,rideMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
let rideTarget=null,rideTimer=null,rideInert=[];
function closeRide(){clearTimeout(rideTimer);rideTimer=null;rideTarget=null;$('ride').classList.remove('open');document.body.classList.remove('travelling');rideInert.forEach(([el,was])=>el.inert=was);rideInert=[]}
function finishRide(){if(rideTarget===null)return;const target=rideTarget;closeRide();load(target);$('pickerBtn').focus()}
function startRide(target){
 if(rideTarget!==null)return;cancelCatalogHold();
 if(rideMotion.matches){load(target);$('pickerBtn').focus();return}
 clearTimeout(winTimer);clearHint();clearInterval(hintTick);hintTick=null;busy=true;
 $('winModal').classList.remove('open');$('levelsModal').classList.remove('open');
 rideTarget=target;$('rideLevel').textContent=`Уровень ${target+1}`;
 $('rideCar').innerHTML=art(0,['h',2,2,0]);$('rideTruck').innerHTML=art(1,['h',0,3,0]);
 rideInert=[document.querySelector('header'),document.querySelector('main'),$('winModal'),$('levelsModal'),$('catalogFooter')].map(el=>[el,el.inert]);rideInert.forEach(([el])=>el.inert=true);
 document.body.classList.add('travelling');$('ride').classList.add('open');$('ride').focus();
 unlockAudio();beep(165,.18,.025);beep(210,.16,.025,.18);
 rideTimer=setTimeout(finishRide,RIDE_MS);
}
$('ride').addEventListener('click',finishRide);
$('ride').addEventListener('keydown',e=>{if(['Enter',' ','Escape'].includes(e.key)){e.preventDefault();e.stopPropagation();finishRide()}});
rideMotion.addEventListener('change',e=>{if(e.matches)finishRide()});

const CATALOG_HOLD_MS=1000;
let catalogPointer=null,catalogTimer=null,catalogHelpTimer=null,catalogNavigating=false;
function catalogAvailable(){return !busy&&!drag&&!catalogNavigating&&!document.querySelector('.overlay.open,.ride.open')}
function cancelCatalogHold(){clearTimeout(catalogTimer);catalogTimer=null;catalogPointer=null;$('catalogBack').classList.remove('holding')}
function catalogHelp(){if(!catalogAvailable())return;clearTimeout(catalogHelpTimer);$('catalogHelp').textContent='Удерживай, чтобы выйти';$('catalogBack').classList.add('help');catalogHelpTimer=setTimeout(()=>{$('catalogBack').classList.remove('help');$('catalogHelp').textContent=''},2000)}
function goCatalog(){if(!catalogAvailable()){cancelCatalogHold();return}cancelCatalogHold();clearTimeout(catalogHelpTimer);catalogNavigating=true;save();window.location.assign('/')}
$('catalogBack').addEventListener('pointerdown',e=>{
 e.stopPropagation();if(e.button!==0||e.isPrimary===false||catalogPointer!==null||!catalogAvailable())return;
 e.preventDefault();clearTimeout(catalogHelpTimer);$('catalogBack').classList.remove('help');$('catalogHelp').textContent='';
 catalogPointer=e.pointerId;$('catalogBack').classList.add('holding');
 catalogTimer=setTimeout(()=>{if(catalogPointer!==null)goCatalog()},CATALOG_HOLD_MS);
});
$('catalogBack').addEventListener('pointerup',e=>{e.stopPropagation();if(e.pointerId!==catalogPointer)return;cancelCatalogHold();catalogHelp()});
$('catalogBack').addEventListener('pointerleave',cancelCatalogHold);
$('catalogBack').addEventListener('pointercancel',cancelCatalogHold);
$('catalogBack').addEventListener('blur',cancelCatalogHold);
$('catalogBack').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();catalogHelp()});
for(const type of ['contextmenu','auxclick','dragstart'])$('catalogBack').addEventListener(type,e=>e.preventDefault());
$('catalogBack').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();e.stopPropagation();goCatalog()}else if(e.key==='Escape'){e.preventDefault();cancelCatalogHold()}});
window.addEventListener('pointerup',e=>{if(e.pointerId===catalogPointer)cancelCatalogHold()});
window.addEventListener('blur',cancelCatalogHold);
document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelCatalogHold()});

load(level);
</script></body></html>
